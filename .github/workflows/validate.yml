name: Validate published site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical pages, links, sitemap and review retention
        run: python3 scripts/validate.py
      - name: Test publishing regression checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test consent and affiliate click measurement
        run: node --test scripts/analytics.test.mjs
